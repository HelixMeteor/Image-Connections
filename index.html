<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Picture Connections</title>

<script>
/* =====================================================================
   ✏️  EDIT THIS SECTION — this is the only part you need to change
   ---------------------------------------------------------------------
   • Put your 16 images in the "images" folder next to this file.
   • Type each image's file name below, e.g. "images/pumpkin.jpg".
     (File names are CASE-SENSITIVE on GitHub: "Cat.JPG" ≠ "cat.jpg")
   • "label" is the image's name. It's used as a caption (if showLabels
     is true), in the answer reveal, and shown on the tile if an image
     can't load.
   • List groups from EASIEST (yellow) to HARDEST (purple).
   • Leave image as "" to make a text-only tile.
   ===================================================================== */
const GAME = {
  title: "Theme: Connection through Communication",
  subtitle: "Find four groups of four images that share something in common.",
  showLabels: false,      // true = show a caption on every image
  mistakesAllowed: 4,

  groups: [
    { category: "Handsy",                       // 🟨 easiest
      items: [
        { image: "connectionsPictures/WillSmithSlap.webp", label: "Slap" },
        { image: "connectionsPictures/SignLanguage.webp", label: "Sign Language" },
        { image: "connectionsPictures/Clapping.webp", label: "Clapping" },
        { image: "connectionsPictures/HeartHands.webp", label: "Hand Heart" }
      ]},
    { category: "Dating Red Flags",                      // 🟩
      items: [
        { image: "connectionsPictures/Ghosted.webp", label: "Ghosted" },
        { image: "connectionsPictures/BreadCrumbing.webp", label: "Breadcrumbing" },
        { image: "connectionsPictures/Gaslighting.webp", label: "Gaslighting" },
        { image: "connectionsPictures/Lovebomb.webp", label: "Love Bombing" }
      ]},
    { category: "Games Where You Lie",                      // 🟦
      items: [
        { image: "connectionsPictures/AmongUs.webp", label: "Among Us" },
        { image: "connectionsPictures/Mafia.webp", label: "Mafia" },
        { image: "connectionsPictures/Poker.webp", label: "Poker" },
        { image: "connectionsPictures/BattleShips.webp", label: "BattleShip" }
      ]},
    { category: "Famous Books",       // 🟪 hardest
      items: [
        { image: "connectionsPictures/Dune.webp", label: "Dune" },
        { image: "connectionsPictures/Jaws.jpg", label: "Jaws" },
        { image: "connectionsPictures/Hatchet.webp", label: "Hatchet" },
        { image: "connectionsPictures/HungryTide.jpg", label: "The Hungry Tide" }
      ]}
  ]
};
/* ======================= END OF EDIT SECTION ======================= */
</script>

<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #fff;
    color: #121212;
    display: flex;
    justify-content: center;
  }
  .wrap { width: 100%; max-width: 560px; padding: 16px; }
  h1 { text-align: center; font-size: 1.8rem; margin: 8px 0 4px; }
  .sub { text-align: center; margin: 0 0 16px; color: #555; }

  .board { display: flex; flex-direction: column; gap: 8px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }

  .tile {
    font: inherit;
    color: inherit;
    position: relative;
    aspect-ratio: 1 / 1;
    border: none;
    border-radius: 8px;
    background: #efefe6;
    padding: 0;
    overflow: hidden;
    cursor: pointer;
    transition: transform .1s ease, box-shadow .1s ease;
  }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile .label {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,.6); color: #fff;
    font-size: .7rem; font-weight: 700;
    padding: 3px 2px; text-align: center;
  }
  .tile.fallback { display: flex; align-items: center; justify-content: center; }
  .tile.fallback .label {
    position: static; background: none; color: inherit;
    font-size: clamp(.65rem, 3vw, .95rem);
    text-transform: uppercase; padding: 4px; word-break: break-word;
  }
  .tile.selected { transform: scale(.93); box-shadow: 0 0 0 4px #121212; }
  .tile.selected::after {
    content: ""; position: absolute; inset: 0; background: rgba(0,0,0,.28);
  }
  .tile.selected.fallback { background: #5a594e; color: #fff; }
  .tile.selected.fallback::after { display: none; }

  .shake { animation: shake .35s; }
  @keyframes shake {
    0%, 100% { translate: 0; } 25% { translate: -6px; } 75% { translate: 6px; }
  }

  .solved { border-radius: 8px; padding: 10px; text-align: center; animation: pop .3s ease; }
  .solved h3 { margin: 0; font-size: 1rem; text-transform: uppercase; letter-spacing: .03em; }
  .solved p { margin: 2px 0 6px; font-size: .85rem; text-transform: uppercase; }
  .thumbs { display: flex; justify-content: center; gap: 6px; }
  .thumbs img { width: 48px; height: 48px; object-fit: cover; border-radius: 4px; }
  @keyframes pop { from { transform: scale(.9); opacity: .4; } to { transform: scale(1); opacity: 1; } }

  .mistakes { text-align: center; margin: 16px 0; font-size: .95rem; }
  .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: #5a594e; margin: 0 3px; vertical-align: middle; }
  .dot.used { background: #ddd; }

  .controls { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
  .btn {
    font: inherit; font-weight: 600;
    border: 1px solid #121212; background: #fff; color: #121212;
    border-radius: 999px; padding: 10px 18px; cursor: pointer;
  }
  .btn.primary { background: #121212; color: #fff; }
  .btn:disabled { opacity: .35; cursor: default; }

  .toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    background: #121212; color: #fff; padding: 10px 16px; border-radius: 6px;
    font-weight: 600; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 10;
  }
  .toast.show { opacity: 1; }

  .end { text-align: center; margin-top: 20px; }
  .end h2 { margin: 0 0 6px; }
  .share { font-size: 1.5rem; line-height: 1.25; margin: 10px 0 14px; }
  .error { background: #ffe5e5; border: 1px solid #e88; padding: 12px; border-radius: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title"></h1>
  <p class="sub" id="subtitle"></p>

  <div class="board">
    <div id="solved" class="board"></div>
    <div id="grid" class="grid"></div>
  </div>

  <div class="mistakes" id="mistakes"></div>

  <div class="controls" id="controls">
    <button class="btn" id="shuffleBtn">Shuffle</button>
    <button class="btn" id="deselectBtn">Deselect all</button>
    <button class="btn primary" id="submitBtn">Submit</button>
  </div>

  <div class="end" id="end" hidden>
    <h2 id="endMsg"></h2>
    <div class="share" id="shareGrid"></div>
    <div class="controls">
      <button class="btn" id="copyBtn">Copy results</button>
      <button class="btn primary" id="againBtn">Play again</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const COLORS = ["#f9df6d", "#a0c35a", "#b0c4ef", "#ba81c5"];
const EMOJI  = ["🟨", "🟩", "🟦", "🟪"];
const $ = id => document.getElementById(id);

let items, selected, solved, mistakes, history, tried, over;

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove("show"), 1600);
}

function makeImg(src, alt, onFail) {
  const img = document.createElement("img");
  img.src = src;
  img.alt = alt;
  img.onerror = onFail;
  return img;
}

function validate() {
  const g = GAME.groups;
  if (!Array.isArray(g) || g.length !== 4) return "You need exactly 4 groups.";
  for (let i = 0; i < 4; i++) {
    if (!g[i].items || g[i].items.length !== 4)
      return `Group ${i + 1} ("${g[i].category}") needs exactly 4 items.`;
  }
  return null;
}

function start() {
  items = [];
  GAME.groups.forEach((g, gi) =>
    g.items.forEach((it, ii) =>
      items.push({ id: gi + "-" + ii, gi, image: it.image || "", label: it.label || "" })));
  shuffle(items);
  selected = new Set();
  solved = [];
  mistakes = 0;
  history = [];
  tried = new Set();
  over = false;
  $("end").hidden = true;
  $("controls").hidden = false;
  render();
}

function render() {
  renderSolved();
  renderGrid();
  renderStatus();
}

function renderSolved() {
  const box = $("solved");
  box.innerHTML = "";
  solved.forEach(gi => {
    const g = GAME.groups[gi];
    const row = document.createElement("div");
    row.className = "solved";
    row.style.background = COLORS[gi];
    row.innerHTML = `<h3></h3><p></p>`;
    row.querySelector("h3").textContent = g.category;
    row.querySelector("p").textContent = g.items.map(i => i.label).join(", ");
    const withImages = g.items.filter(i => i.image);
    if (withImages.length) {
      const thumbs = document.createElement("div");
      thumbs.className = "thumbs";
      withImages.forEach(i => {
        const img = makeImg(i.image, i.label, () => img.remove());
        thumbs.appendChild(img);
      });
      row.appendChild(thumbs);
    }
    box.appendChild(row);
  });
}

function renderGrid() {
  const grid = $("grid");
  grid.innerHTML = "";
  items.forEach(item => {
    const tile = document.createElement("button");
    tile.className = "tile";
    tile.dataset.id = item.id;
    tile.setAttribute("aria-label", item.label || "image");
    if (selected.has(item.id)) tile.classList.add("selected");

    const label = document.createElement("span");
    label.className = "label";
    label.textContent = item.label;

    if (item.image) {
      const img = makeImg(item.image, item.label, () => {
        img.remove();
        tile.classList.add("fallback");
        if (!tile.contains(label)) tile.appendChild(label);
      });
      tile.appendChild(img);
      if (GAME.showLabels) tile.appendChild(label);
    } else {
      tile.classList.add("fallback");
      tile.appendChild(label);
    }

    tile.addEventListener("click", () => toggle(item.id, tile));
    grid.appendChild(tile);
  });
}

function renderStatus() {
  const left = GAME.mistakesAllowed - mistakes;
  let dots = "";
  for (let i = 0; i < GAME.mistakesAllowed; i++)
    dots += `<span class="dot${i < left ? "" : " used"}"></span>`;
  $("mistakes").innerHTML = "Mistakes remaining: " + dots;
  $("submitBtn").disabled = over || selected.size !== 4;
  $("deselectBtn").disabled = over || selected.size === 0;
  $("shuffleBtn").disabled = over;
}

function toggle(id, tile) {
  if (over) return;
  if (selected.has(id)) {
    selected.delete(id);
    tile.classList.remove("selected");
  } else if (selected.size < 4) {
    selected.add(id);
    tile.classList.add("selected");
  }
  renderStatus();
}

function submit() {
  if (over || selected.size !== 4) return;
  const key = [...selected].sort().join("|");
  if (tried.has(key)) { toast("Already guessed!"); return; }
  tried.add(key);

  const picks = items.filter(i => selected.has(i.id));
  history.push(picks.map(i => i.gi));

  const counts = {};
  picks.forEach(i => counts[i.gi] = (counts[i.gi] || 0) + 1);
  const best = Math.max(...Object.values(counts));

  if (best === 4) {
    const gi = picks[0].gi;
    solved.push(gi);
    items = items.filter(i => i.gi !== gi);
    selected.clear();
    render();
    if (solved.length === GAME.groups.length) setTimeout(() => finish(true), 400);
  } else {
    mistakes++;
    if (best === 3) toast("One away…");
    document.querySelectorAll(".tile.selected").forEach(t => {
      t.classList.remove("shake");
      void t.offsetWidth;
      t.classList.add("shake");
    });
    if (mistakes >= GAME.mistakesAllowed) {
      over = true;
      renderStatus();
      setTimeout(() => finish(false), 700);
    } else {
      renderStatus();
    }
  }
}

function finish(won) {
  over = true;
  GAME.groups.forEach((_, gi) => { if (!solved.includes(gi)) solved.push(gi); });
  items = [];
  selected.clear();
  render();
  $("controls").hidden = true;
  $("endMsg").textContent = won
    ? (mistakes === 0 ? "Helluva Job! 🎉" : "Thank You Yellow Jackets 🎉")
    : "Next time Yellow Jacket! Here are the answers.";
  $("shareGrid").innerHTML = history.map(r => r.map(g => EMOJI[g]).join("")).join("<br>");
  $("end").hidden = false;
}

async function copyResults() {
  const text = GAME.title + "\n" + history.map(r => r.map(g => EMOJI[g]).join("")).join("\n");
  try {
    await navigator.clipboard.writeText(text);
    toast("Copied!");
  } catch (e) {
    toast("Couldn't copy on this browser");
  }
}

$("title").textContent = GAME.title;
$("subtitle").textContent = GAME.subtitle;
document.title = GAME.title;

$("shuffleBtn").onclick = () => { shuffle(items); renderGrid(); };
$("deselectBtn").onclick = () => { selected.clear(); renderGrid(); renderStatus(); };
$("submitBtn").onclick = submit;
$("copyBtn").onclick = copyResults;
$("againBtn").onclick = start;

const problem = validate();
if (problem) {
  document.querySelector(".board").innerHTML =
    `<div class="error"><strong>Setup problem:</strong> ${problem} Check the edit section at the top of index.html.</div>`;
  $("controls").hidden = true;
} else {
  start();
}
</script>
</body>
</html>
